<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081B44" />
      <stop offset="100%" stop-color="#020B1C" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Badge -->
  <circle cx="256" cy="256" r="244" fill="url(#bgGrad)" stroke="#1643B8" stroke-width="10" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#E5F800" stroke-width="4" opacity="0.9" />

  <!-- Iconic Speedy Way Sail -->
  <g transform="translate(92, 75) scale(4.8)">
    <path d="M 68 6 C 50 18, 12 40, 2 64 C 18 56, 42 58, 62 70 C 52 50, 58 24, 68 6 Z" fill="#FFFFFF" />
    <circle cx="76" cy="62" r="6" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.85" />
    <text x="76" y="65" font-family="'Montserrat', 'Arial', sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="0.85">R</text>
  </g>
</svg>
